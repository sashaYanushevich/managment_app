<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Users</title>
    <!-- Bootstrap and styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="container-fluid">
        <h2 class="mt-4">Users</h2>
        <div class="search-container">
            <input type="text" id="search-input" class="form-control" placeholder="Search...">
            <button id="search-button" class="btn btn-primary"><i class="fas fa-search"></i></button>
            <button id="add-user" class="btn btn-success"><i class="fas fa-plus"></i> Add User</button>
            <button id="import-data" class="btn btn-info"><i class="fas fa-file-import"></i> Import Data</button>
        </div>
        <table id="users-table" class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Login</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <div id="user-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2 id="modal-title">Add User</h2>
                <form id="user-form">
                    <input type="hidden" id="user-id" name="user-id">
                    <div class="form-group">
                        <label for="login">Login:</label>
                        <input type="text" id="login" name="login" required>
                    </div>
                    <div class="form-group" id="password-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">
                    </div>
                    <div class="form-group">
                        <label for="status">Status:</label>
                        <select id="status" name="status">
                            <option value="active">Active</option>
                            <option value="inactive">Deactive</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Save</button>
                </form>
            </div>
        </div>

        <!-- Add new modal for password change -->
        <div id="change-password-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Change User Password</h2>
                <form id="change-password-form">
                    <input type="hidden" id="password-user-id" name="password-user-id">
                    <div class="form-group">
                        <label for="new-password">New Password:</label>
                        <input type="password" id="new-password" name="new-password" required>
                    </div>
                    <button type="submit" class="btn">Change Password</button>
                </form>
            </div>
        </div>

        <!-- Add this modal at the bottom of the container-fluid div -->
        <div id="import-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Import Data</h2>
                <form id="import-form">
                    <input type="hidden" id="import-user-id" name="import-user-id">
                    <div class="form-group">
                        <label for="import-data">YAML Data:</label>
                        <textarea id="import-data-textarea" name="import-data-textarea" rows="10" required placeholder="package_id: pkg316babc0
start_date: 2024-12-04
expiry: 2025-12-04
max_modems: 100
servers:
  - name: nim
    modems: 50
    MachineData: n_cpu=2,rootfs=51340,mem=3798,bios_uuid=03aa02fc-0414-059d-e006-2a0700080009"></textarea>
                    </div>
                    <button type="submit" class="btn">Import</button>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin.js"></script>
</body>

</html>
